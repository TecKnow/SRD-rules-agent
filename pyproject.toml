[project]
name = "srd-rules-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.0.20",
    "deepeval>=3.7.0",
    "langchain-openrouter>=0.2.3",
    "langchain-text-splitters>=1.1.2",
    "marimo[recommended]>=0.23.8",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
srd-eval-gather = "srd_eval.gather_no_rag:main"
srd-eval-gather-rag = "srd_eval.gather_rag:main"
srd-eval-grade = "srd_eval.grade_deepeval:main"

[tool.pytest.ini_options]
pythonpath = ["."]
