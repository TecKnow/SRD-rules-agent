[project]
name = "srd-rules-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.0.20",
    "deepeval>=3.7.0",
    "langchain-openrouter>=0.2.3",
    "langchain-text-splitters>=1.1.2",
    "marimo[recommended]>=0.23.8",
    "markdown>=3.6",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# Local tool-using agent (srd_agent). Install with: uv sync --extra agent
# chromadb / langchain-text-splitters / python-dotenv come from the base deps above.
agent = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
# In-process cross-encoder reranker for the bake-off.
# torch comes from the PyTorch CUDA index (see [tool.uv] below) so it runs on the GPU.
# Install with: uv sync --extra agent --extra reranker
reranker = [
    "torch>=2.12",
    "sentence-transformers>=3.0",
]

[project.scripts]
srd-eval-gather = "srd_eval.gather_no_rag:main"
srd-eval-gather-rag = "srd_eval.gather_rag:main"
srd-eval-grade = "srd_eval.grade_deepeval:main"
srd-eval-build-wasm = "scripts.build_wasm_dataset:main"
srd-agent-build-index = "srd_agent.build_index:main"
srd-agent-bakeoff = "srd_agent.bakeoff:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# CUDA torch only ships win/linux wheels; this project runs on Windows (+ WSL).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
# Pull torch from PyTorch's CUDA 13.0 index so the reranker runs on the GPU.
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
